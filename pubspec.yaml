name: lexistack
description: Offline word connections with campaign and daily progress.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
  lexistack_content_contract:
    git:
      url: https://github.com/oliversinz/lexistack-content.git
      ref: d9acbd52de0e198dd109a4859299318db3f465f5
      path: packages/lexistack_content_contract

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/fraunces.ttf
    - family: DM Sans
      fonts:
        - asset: assets/fonts/dmsans.ttf
  assets:
    - assets/levels/manifest.json
    - assets/levels/pack1.json
    - assets/levels/daily.json
